<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Passionaris — лаунчер</title>
</head>
<body class="grain">
  <div id="bg" class="menu-art"></div>
  <div class="vignette"></div>

  <div id="titlebar">
    <span class="tb-title">Passionaris</span>
    <div class="tb-buttons">
      <button id="win-min" title="Свернуть">—</button>
      <button id="win-close" title="Закрыть">✕</button>
    </div>
  </div>

  <main id="launcher">
    <section class="hero">
      <h1 class="sr-only">Passionaris</h1>
      <canvas id="logo" aria-hidden="true"></canvas>
      <p class="tagline">Великая стратегия о восходе и закате народов</p>
      <div class="version-row">
        <span class="version-chip" id="ver"></span>
        <span class="epoch" id="epoch"></span>
      </div>

      <div class="actions">
        <button class="btn primary big" id="play">Играть</button>
        <button class="btn stone" id="continue" disabled title="Сохранений пока нет">Продолжить</button>
        <button class="btn stone" id="open-settings">Настройки</button>
        <button class="btn stone" id="quit">Выход</button>
      </div>
    </section>

    <aside class="side">
      <div class="paper news"><div class="paper-body">
        <div class="news-head">
          <h2>Журнал изменений</h2>
          <select id="version-select" title="Версии игры"></select>
        </div>
        <div id="changelog" class="changelog"></div>
      </div></div>
      <div class="paper roadmap"><div class="paper-body">
        <h2>Эпоха 0 · Фундамент</h2>
        <ul id="roadmap"></ul>
      </div></div>
    </aside>
  </main>

  <footer class="foot">
    <span>Данные: Natural Earth, NASA, AWS Terrain Tiles, WorldClim, Smithsonian GVP, NOAA NCEI</span>
    <span><span id="art-caption" class="art-caption"></span> · <span id="foot-ver"></span></span>
  </footer>

  <div class="modal-back" id="settings">
    <div class="modal paper"><div class="paper-body">
      <h2>Настройки</h2>
      <div class="dim">Сохраняются между запусками</div>
      <div class="rule"></div>
      <div class="field"><label>Палитра</label><select id="s-palette"></select></div>
      <div class="field"><label>Режим окна</label>
        <select id="s-window"><option value="fullscreen">Полный экран</option><option value="maximized">Окно на весь экран</option><option value="window">Окно</option></select></div>
      <div class="field"><label>Видеокарта · после перезапуска</label>
        <select id="s-gpu"><option value="discrete">Дискретная (быстрее)</option><option value="auto">Как решит система</option></select></div>
      <div class="field"><label>Детализация сетки</label>
        <select id="s-quality"><option value="auto">Авто</option><option value="low">Низкая</option><option value="medium">Средняя</option><option value="high">Высокая</option></select></div>
      <div class="field"><label>Масштаб рендеринга</label>
        <select id="s-scale"><option value="auto">Авто — держит частоту кадров</option><option value="0.5">50% — максимум FPS</option><option value="0.67">67%</option><option value="0.8">80%</option><option value="1">100% — максимум чёткости</option></select></div>
      <div class="field"><label>Яркость</label><input type="range" id="s-bright" min="0.7" max="1.3" step="0.01" /></div>
      <div class="field"><label>Высота рельефа (1 = как в жизни)</label><input type="range" id="s-relief" min="1" max="10" step="0.5" /></div>
      <div class="field"><label>Разворачивание глобуса</label><input type="range" id="s-unroll" min="0" max="1" step="0.01" /></div>
      <div class="field packs"><label>Дополнения и моды · при следующем запуске игры</label><div id="s-packs" class="pack-list"><span class="dim">Нет установленных</span></div></div>
      <div class="rule"></div>
      <div style="display:flex; gap:8px; justify-content:flex-end">
        <button class="btn stone" id="s-reset">Сбросить</button>
        <button class="btn primary" id="s-close">Готово</button>
      </div>
    </div></div>
  </div>

  <script type="module" src="/src/launcher/launcher.js"></script>
</body>
</html>
