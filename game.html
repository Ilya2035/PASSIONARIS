<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ORBIS</title>
</head>
<body>
  <canvas id="view"></canvas>

  <div id="loading">
    <div class="load-inner">
      <div class="load-title title-font">ORBIS</div>
      <div class="load-sub"><span id="load-version"></span></div>
      <div class="load-bar"><div id="load-fill"></div></div>
      <div id="load-text" class="muted">Разворачиваем карту мира…</div>
    </div>
  </div>

  <header id="topbar" class="panel">
    <div class="tb-left">
      <svg class="emblem" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="1.4"/><ellipse cx="16" cy="16" rx="6" ry="13" fill="none" stroke="currentColor" stroke-width="1"/><path d="M3 16h26M5.5 9h21M5.5 23h21" stroke="currentColor" stroke-width="0.9" fill="none"/></svg>
      <span class="title-font tb-name">ORBIS</span>
      <span id="tb-version" class="version-chip"></span>
    </div>
    <div class="tb-center title-font" id="tb-epoch"></div>
    <div class="tb-right">
      <span id="fps" class="muted"></span>
      <button class="btn small" id="btn-menu" title="Меню (Esc)">☰</button>
    </div>
  </header>

  <aside id="info" class="panel hidden">
    <button class="close" id="info-close" title="Закрыть">×</button>
    <div class="info-kicker" id="info-kicker">Район</div>
    <h1 class="title-font" id="info-title"></h1>
    <hr class="rule" />
    <dl id="info-list"></dl>
    <div class="info-note muted">Районы — игровые единицы. Каждый состоит из мелких атомарных участков карты.</div>
  </aside>

  <div id="tooltip" class="panel hidden"></div>

  <div id="hud-left" class="panel">
    <div id="compass" title="Север всегда сверху. При пролёте над полюсом экран плавно разворачивается.">
      <svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="21" fill="none" stroke="var(--brass-soft)"/><g id="compass-needle"><path d="M24 6 L29 24 L24 21 L19 24 Z" fill="var(--brass-hi)"/><path d="M24 42 L29 24 L24 27 L19 24 Z" fill="#5d6673"/><text x="24" y="4.8" text-anchor="middle" font-size="6" fill="var(--parch)">С</text></g></svg>
    </div>
    <div class="hud-col">
      <div class="scale"><div id="scale-bar"></div><span id="scale-text"></span></div>
      <div id="coords" class="muted"></div>
    </div>
  </div>

  <nav id="modes" class="panel"></nav>

  <div class="modal-back" id="menu">
    <div class="modal panel">
      <h2>Пауза</h2>
      <div class="muted" id="menu-version"></div>
      <hr class="rule" />
      <div class="field"><label>Высота рельефа</label><input type="range" id="set-relief" min="0.3" max="2.5" step="0.05" /></div>
      <div class="field"><label>Разворачивание глобуса при приближении</label><input type="range" id="set-unroll" min="0" max="1" step="0.01" /></div>
      <div class="field"><label>Границы районов</label><input type="checkbox" id="set-districts" /></div>
      <div class="field"><label>Реки</label><input type="checkbox" id="set-rivers" /></div>
      <hr class="rule" />
      <div class="menu-actions">
        <button class="btn" id="menu-resume">Продолжить</button>
        <button class="btn" id="menu-launcher">В лаунчер</button>
        <button class="btn" id="menu-quit">Выйти из игры</button>
      </div>
      <div class="muted keys"><kbd>ЛКМ</kbd> тянуть карту · <kbd>Колесо</kbd> зум к курсору · <kbd>WASD</kbd> движение · <kbd>1–4</kbd> режимы · <kbd>Home</kbd> к глобусу</div>
    </div>
  </div>

  <script type="module" src="/src/game/main.js"></script>
</body>
</html>
