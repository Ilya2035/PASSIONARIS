<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Passionaris</title>
  <script>
    // interface scale before the first paint (the loading screen): the 'auto' rule of autoUiScale() in
    // src/game/ui/hud.js — keep both in sync. main.js applies the player's own setting a moment later.
    (function () {
      var w = innerWidth, h = innerHeight, d = devicePixelRatio || 1, s = Math.min(h / 1080, w / 1600);
      var k = s >= 1 ? 1 + (s - 1) * 0.7 : s >= 0.8333 ? 1 : 1 - (0.8333 - s) * 1.1;
      k = Math.round(Math.min(2.2, Math.max(k, 0.7, 0.85 / d)) * 20) / 20;
      k = Math.max(0.6, Math.min(k, Math.floor(Math.min(w / 760, h / 480) * 20) / 20));
      document.documentElement.style.setProperty('--ui', String(k));
    })();
  </script>
</head>
<body>
  <canvas id="view"></canvas>

  <div id="loading">
    <div class="load-inner">
      <div class="load-title title-font">PASSIONARIS</div>
      <div class="load-sub"><span id="load-version"></span></div>
      <div class="load-bar"><div id="load-fill"></div></div>
      <div id="load-text">Разворачиваем карту мира…</div>
    </div>
  </div>

  <!-- the only permanent element: date & time, top right -->
  <div id="clock" class="panel">
    <div class="panel-body">
      <div id="clock-date" class="title-font">—</div>
      <div id="clock-time">—</div>
      <div id="clock-speed" role="group" aria-label="Скорость времени">
        <button class="spd" data-speed="0" title="Пауза (Пробел)"><svg viewBox="0 0 16 16"><rect x="3" y="2" width="3.5" height="12"/><rect x="9.5" y="2" width="3.5" height="12"/></svg></button>
        <button class="spd" data-speed="1" title="Скорость 1">1</button>
        <button class="spd" data-speed="2" title="Скорость 2">2</button>
        <button class="spd" data-speed="3" title="Скорость 3">3</button>
        <button class="spd" data-speed="4" title="Скорость 4">4</button>
        <button class="spd" data-speed="5" title="Скорость 5">5</button>
      </div>
    </div>
  </div>

  <!-- legend of the current map mode (click to fold) -->
  <div id="legend" class="panel hidden" title="Щёлкните, чтобы свернуть"><div class="panel-body"><div class="lg-title"></div><div class="lg-body"></div></div></div>

  <!-- map modes: square buttons, bottom right -->
  <nav id="modes" aria-label="Режимы карты"></nav>

  <!-- small scale + compass, bottom left -->
  <div id="hud-left">
    <svg id="compass" viewBox="0 0 48 48" aria-label="Компас"><rect x="1" y="1" width="46" height="46" fill="#1b2130" stroke="#4a576f" stroke-width="2"/><g id="compass-needle"><path d="M24 5 L30 24 L18 24 Z" fill="#f3f5f9"/><path d="M24 43 L30 24 L18 24 Z" fill="#6b7489"/></g></svg>
    <div class="scale"><div id="scale-bar"></div><span id="scale-text"></span></div>
    <button id="chronicle-btn" class="btn icon" title="Хроника мира (J)" aria-label="Хроника мира"><svg viewBox="0 0 24 24"><path d="M6 4h10a2 2 0 0 1 2 2v12a2 2 0 0 0 2 2H8a2 2 0 0 1-2-2V4z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M6 4a2 2 0 0 0-2 2v2h2M9 8h6M9 11h6M9 14h4" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></button>
  </div>

  <!-- info window: opens on click -->
  <aside id="info" class="panel hidden">
    <div class="panel-body">
      <button class="close" id="info-close" title="Закрыть">×</button>
      <div class="info-kicker" id="info-kicker"></div>
      <h1 id="info-title"></h1>
      <div class="rule"></div>
      <dl id="info-list"></dl>
    </div>
  </aside>

  <div id="tooltip" class="hidden"></div>
  <div id="toasts"></div>

  <!-- pause menu -->
  <div class="modal-back" id="menu">
    <div class="modal panel"><div class="panel-body">
      <h2>Пауза</h2>
      <div class="dim" id="menu-version"></div>
      <div class="rule"></div>
      <div class="menu-actions">
        <button class="btn" id="menu-resume">Продолжить</button>
        <button class="btn" id="menu-save">Сохранить</button>
        <button class="btn" id="menu-load">Загрузить</button>
        <button class="btn" id="menu-settings">Настройки</button>
        <button class="btn" id="menu-launcher">В лаунчер</button>
        <button class="btn danger" id="menu-quit">Выйти из игры</button>
      </div>
      <div class="keys dim"><kbd>ЛКМ</kbd> тянуть · <kbd>Колесо</kbd> зум · <kbd>Пробел</kbd> пауза · <kbd>1–5</kbd> скорость · <kbd>F5</kbd> быстрое сохранение · <kbd>F9</kbd> загрузка</div>
    </div></div>
  </div>

  <!-- saves -->
  <div class="modal-back" id="saves">
    <div class="modal panel wide"><div class="panel-body">
      <button class="close" data-close="saves">×</button>
      <h2 id="saves-title">Сохранения</h2>
      <div class="rule"></div>
      <div class="save-new"><input id="save-name" maxlength="60" placeholder="Название сохранения" /><button class="btn ok" id="save-do">Сохранить</button></div>
      <div id="save-list"></div>
    </div></div>
  </div>

  <!-- chronicle: the great events of the world so far -->
  <div class="modal-back" id="chronicle">
    <div class="modal panel wide"><div class="panel-body">
      <button class="close" data-close="chronicle">×</button>
      <h2>Хроника мира</h2>
      <div class="rule"></div>
      <div id="chronicle-list"></div>
    </div></div>
  </div>

  <!-- settings -->
  <div class="modal-back" id="settings">
    <div class="modal panel wide"><div class="panel-body">
      <button class="close" data-close="settings">×</button>
      <h2>Настройки</h2>
      <div class="rule"></div>
      <div id="settings-fields"></div>
    </div></div>
  </div>

  <script type="module" src="/src/game/main.js"></script>
</body>
</html>
